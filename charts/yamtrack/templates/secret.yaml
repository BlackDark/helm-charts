{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $secretName := include "yamtrack.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "yamtrack.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.secret.existingSecretKey) }}
  {{ .Values.secret.existingSecretKey }}: {{ index $existing.data .Values.secret.existingSecretKey }}
  {{- else if .Release.IsUpgrade }}
  {{- fail "Django SECRET Secret missing on upgrade; refusing to rotate. Restore the Secret or set secret.existingSecret." }}
  {{- else if .Values.secret.value }}
  {{ .Values.secret.existingSecretKey }}: {{ .Values.secret.value | b64enc }}
  {{- else }}
  {{ .Values.secret.existingSecretKey }}: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}

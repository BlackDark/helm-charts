apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "yamtrack.fullname" . }}-test-connection"
  labels:
    helm.sh/chart: {{ include "yamtrack.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ["wget"]
      args:
        - "--spider"
        - "-q"
        - "-T"
        - "10"
        - "http://{{ include "yamtrack.fullname" . }}:{{ .Values.service.port }}/health/"

# Default values for yamtrack.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/fuzzygrim/yamtrack
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Recreate is required for ReadWriteOnce SQLite PVCs (default).
# Switch to RollingUpdate only if persistence.accessMode is ReadWriteMany
# or persistence is disabled.
updateStrategy:
  type: Recreate

# Static configuration values (written to ConfigMap).
# See https://github.com/FuzzyGrim/Yamtrack/wiki/Environment-Variables
config:
  TZ: "UTC"
  # Disable public sign-up after creating the first account.
  REGISTRATION: "true"
  WEB_CONCURRENCY: "1"
  # Official image remaps to this uid/gid at startup. Keep in sync with
  # podSecurityContext.fsGroup so the SQLite PVC stays writable.
  PUID: "1000"
  PGID: "1000"
  # Public origins for CSRF, OAuth, and webhooks. Required behind a reverse proxy.
  # Example: "https://yamtrack.example.com"
  # URLS: "https://yamtrack.example.com"
  # ALLOWED_HOSTS: "yamtrack.example.com"
  # CSRF: "https://yamtrack.example.com"
  # Host under a subpath (no trailing slash): BASE_URL: "/yamtrack"
  # ADMIN_ENABLED: "false"
  # TRACK_TIME: "true"
  # TMDB_NSFW: "false"
  # MAL_NSFW: "false"
  # MU_NSFW: "false"
  # IGDB_NSFW: "false"
  # REDIS_PREFIX: "yamtrack"
  # HEALTHCHECK_CELERY_PING_TIMEOUT: "1"

# Django SECRET. Auto-generated on first install and reused on upgrade
# unless existingSecret is set.
secret:
  create: true
  # Optional explicit value. Empty = random 64-char string on first install.
  value: ""
  existingSecret: ""
  existingSecretKey: SECRET

# Redis is required (cache + Celery). Provide a URL or an existing secret.
# The chart does not bundle Redis.
redis:
  url: ""
  existingSecret: ""
  existingSecretKey: url

# PostgreSQL is optional. When disabled, Yamtrack uses SQLite on the data PVC.
postgresql:
  enabled: false
  host: ""
  port: 5432
  database: yamtrack
  user: yamtrack
  existingSecret: ""
  existingSecretPasswordKey: password
  # Optional extra DB_* keys, e.g. DB_SSL_MODE=require
  extraConfig: {}
  # DB_SSL_MODE: require

# Extra env vars (value or valueFrom). Use for API keys and other secrets.
# Example:
# extraEnv:
#   - name: TMDB_API
#     valueFrom:
#       secretKeyRef:
#         name: yamtrack-apis
#         key: tmdb
extraEnv: []

# Extra envFrom entries (configMapRef / secretRef).
extraEnvFrom: []

persistence:
  enabled: true
  existingClaim: ""
  annotations:
    helm.sh/resource-policy: keep
  accessMode: ReadWriteOnce
  storageClass: ""
  size: 1Gi
  # Official image chowns ./db. Do not change unless using a custom image.
  mountPath: /yamtrack/db

serviceAccount:
  create: true
  # Yamtrack does not call the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Official image entrypoint runs as root to remap PUID/PGID, then supervisord
# starts nginx as root and gunicorn/celery as uid 1000. runAsNonRoot is not
# compatible with that image.
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE

service:
  type: ClusterIP
  port: 8000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Optional NetworkPolicy. Disabled by default so DNS/Redis/API traffic is not
# blocked on clusters without matching labels. Enable and set redis selector.
networkPolicy:
  enabled: false
  # NetworkPolicyPeer list for ingress.from on port 8000.
  # Empty = allow from all. If set, only those peers can reach the app.
  extraIngress: []
  # extraIngress:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: traefik
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: traefik
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Allow Redis (required when networkPolicy.enabled).
  redis:
    port: 6379
    # Match labels of the Redis pods, e.g. app.kubernetes.io/name: redis
    podSelector: {}
    namespaceSelector: {}
  # Required when postgresql.enabled and networkPolicy.enabled.
  postgres:
    port: 5432
    podSelector: {}
    namespaceSelector: {}
  # Egress to media APIs (TMDB, MAL, IGDB, ...). Set false to deny 443.
  allowHTTPS: true
  extraEgress: []

livenessProbe:
  httpGet:
    path: /health/
    port: http
  periodSeconds: 45
  timeoutSeconds: 15
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health/
    port: http
  periodSeconds: 10
  timeoutSeconds: 15
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 15
  failureThreshold: 30

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

priorityClassName: ""
# Celery stopwaitsecs=60 in the image. Must exceed that on Recreate.
terminationGracePeriodSeconds: 70

extraVolumes: []
extraVolumeMounts: []
